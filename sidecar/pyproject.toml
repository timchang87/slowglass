[project]
name = "slowglass"
version = "0.1.0"
description = "Slowglass Studio sidecar: HTTP + MCP service for the desktop app"
authors = [
    { name = "Tim Chang" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
slowglass = "slowglass:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.mypy]
strict = true
files = ["src", "tests"]
