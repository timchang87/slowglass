services:
  frontend:
    container_name: web
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      target: base
      platforms:
        - 'linux/amd64'
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./client/package.json
    working_dir: /app
    depends_on:
      - backend
    ports:
      - 8080:8080
    environment:
      - PROXY_TARGET=https://node:3000
      - DEV_PORT=8080
      - SERVER_PORT=3000
    command: npm run dev

  backend:
    container_name: node
    build:
      context: ./
      dockerfile: Dockerfile.backend
      target: base
      platforms:
        - 'linux/amd64'
    expose:
      - '3000'
    depends_on:
      - db
    volumes:
      - ./server:/app
      - /app/node_modules/
    env_file:
      - ./server/.env
    command: npm run dev

  db:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD} # Added for testing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
