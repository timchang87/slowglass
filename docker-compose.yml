services:
  frontend:
    container_name: web
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      target: base
      platforms:
        - 'linux/amd64'
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
          ignore:
            - node_modules
        - action: rebuild
          path: ./client/package.json
    working_dir: /app/client
    depends_on:
      - backend
    ports:
      - 8080:8080
    environment:
      - PROXY_TARGET=https://node:3000
      - DEV_PORT=8080
      - SERVER_PORT=3000
    command: npm run dev

  backend:
    container_name: node
    build:
      context: ./
      dockerfile: Dockerfile.backend
      target: base
      platforms:
        - 'linux/amd64'
    develop:
      watch:
        - action: sync
          path: ./services/core
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./services/core/package.json
    expose:
      - '3000'
    depends_on:
      - db
    env_file:
      - ./services/core/.env
    command: npm run dev

  db:
    container_name: postgres
    image: postgres:17
    env_file:
      - ./services/core/.env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
