default_language_version:
  python: python3.11
repos:
  - repo: local
    hooks:
      - id: npm-lint
        name: Check Linting
        entry: npm run lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: npm-prettier
        name: Check Prettier
        entry: npm run format
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: npm-types-check
        name: Check Types
        entry: npm run types-check
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: cdk-synth
        name: CDK Synth
        entry: bash -c 'cd services/core/infra && npx cdk synth'
        language: system
        files: ^services/core/infra/
        pass_filenames: false

      - id: cdk-test
        name: CDK Tests
        entry: bash -c 'cd services/core/infra && npm test'
        language: system
        files: ^services/core/infra/
        pass_filenames: false

      - id: npm-test
        name: Check Unit Tests
        entry: npm run test:related
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
